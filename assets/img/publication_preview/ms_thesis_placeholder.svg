<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Placeholder graphical abstract for a supervised master's thesis</title>
  <desc id="desc">A simple placeholder image with abstract research panels and a thesis label.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8eef4"/>
      <stop offset="0.55" stop-color="#f5f1e8"/>
      <stop offset="1" stop-color="#dde8de"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <circle cx="214" cy="145" r="138" fill="#91a7bd" opacity="0.35" filter="url(#soft)"/>
  <circle cx="1022" cy="607" r="160" fill="#8eb59a" opacity="0.3" filter="url(#soft)"/>
  <circle cx="882" cy="160" r="110" fill="#c8a06b" opacity="0.25" filter="url(#soft)"/>
  <rect x="92" y="98" width="1016" height="564" rx="32" fill="#ffffff" opacity="0.82"/>
  <g fill="none" stroke="#536274" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
